<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>OG Image Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  body { background:#1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; font-family:Inter,sans-serif; padding:24px; }
  .btn { background:#5B4EFF; color:#fff; border:none; border-radius:10px; padding:12px 28px; font-size:0.95rem; font-weight:600; cursor:pointer; }
  .note { color:#8892A4; font-size:0.85rem; text-align:center; max-width:500px; line-height:1.6; }
  canvas { border-radius:8px; box-shadow:0 16px 60px rgba(0,0,0,0.5); max-width:100%; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<button class="btn" onclick="dl()">Download og-social.png</button>
<p class="note">Upload this file as <strong style="color:#fff">og-social.png</strong> to the ROOT of your GitHub repo. This image appears when you share any Driftocity page on Facebook, Instagram, LinkedIn, or X.</p>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const W=1200,H=630;
document.fonts.ready.then(draw);
function draw(){
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#070B16');bg.addColorStop(1,'#0D1225');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=48)for(let y=0;y<H;y+=48){
    ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);
    ctx.fillStyle='rgba(91,78,255,0.18)';ctx.fill();
  }
  function orb(cx,cy,r,col,a){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,`rgba(${col},${a})`);
    g.addColorStop(0.5,`rgba(${col},${a*.3})`);
    g.addColorStop(1,`rgba(${col},0)`);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  }
  orb(200,180,300,'91,78,255',.25);
  orb(1050,480,260,'120,60,255',.2);
  orb(600,315,400,'60,40,180',.08);
  const tl=ctx.createLinearGradient(80,0,W-80,0);
  tl.addColorStop(0,'rgba(91,78,255,0)');tl.addColorStop(.3,'rgba(91,78,255,.8)');
  tl.addColorStop(.7,'rgba(91,78,255,.8)');tl.addColorStop(1,'rgba(91,78,255,0)');
  ctx.fillStyle=tl;ctx.fillRect(80,38,W-160,2);
  ctx.fillStyle=tl;ctx.fillRect(80,H-40,W-160,2);
  // badge
  rr(ctx,64,60,220,42,10);ctx.fillStyle='rgba(91,78,255,.2)';ctx.fill();
  ctx.strokeStyle='rgba(91,78,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.font="600 17px 'Inter'";ctx.fillStyle='#7B6FFF';ctx.textAlign='left';
  ctx.fillText('driftocity.com',82,88);
  // logo
  ctx.font="800 90px 'Syne'";
  ctx.fillStyle='#FFFFFF';ctx.fillText('Drift',64,208);
  const dw=ctx.measureText('Drift').width;
  ctx.fillStyle='#7B6FFF';ctx.fillText('ocity',64+dw,208);
  // tagline
  ctx.font="400 26px 'Inter'";ctx.fillStyle='#8892A4';
  ctx.fillText('AI Tools · Web Design · PDF Guides · Custom SaaS',64,254);
  // divider
  ctx.fillStyle='rgba(91,78,255,.3)';ctx.fillRect(64,288,500,1.5);
  // feature cards
  const feats=[['🌐','Websites from $100'],['🤖','AI SaaS Tools'],['📄','PDF Guides'],['⚙️','Custom Builds']];
  let fx=64;
  feats.forEach(([icon,label])=>{
    rr(ctx,fx,310,256,68,12);ctx.fillStyle='rgba(255,255,255,.04)';ctx.fill();
    ctx.strokeStyle='rgba(91,78,255,.22)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='26px serif';ctx.fillStyle='#fff';ctx.fillText(icon,fx+14,358);
    ctx.font="600 17px 'Inter'";ctx.fillStyle='#F0F2FF';ctx.fillText(label,fx+50,358);
    fx+=272;
  });
  // right CTA box
  rr(ctx,W-360,H/2-130,296,260,18);
  ctx.fillStyle='rgba(91,78,255,.1)';ctx.fill();
  ctx.strokeStyle='rgba(91,78,255,.4)';ctx.lineWidth=2;ctx.stroke();
  ctx.textAlign='center';
  ctx.font="800 48px 'Syne'";ctx.fillStyle='#FFFFFF';ctx.fillText('Get',W-212,H/2-50);
  ctx.fillStyle='#7B6FFF';ctx.fillText('Started',W-212,H/2+8);
  ctx.font="500 19px 'Inter'";ctx.fillStyle='#8892A4';ctx.fillText('driftocity.com',W-212,H/2+50);
  // bottom
  ctx.textAlign='left';
  ctx.font="500 19px 'Inter'";ctx.fillStyle='rgba(136,146,164,.65)';
  ctx.fillText('By Raymond Hockersmith  ·  Indiana, USA',64,H-46);
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function dl(){
  const a=document.createElement('a');
  a.download='og-social.png';a.href=c.toDataURL('image/png');a.click();
}
</script>
</body>
</html>
